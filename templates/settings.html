<div id="settingsHeader">
    <button id="settingsBackBtn" class="history-nav-btn">&#8592; Назад</button>
    <span id="settingsTitle">Настройки</span>
</div>

<!-- Темп запросов подбирается автоматически, главы выбираются по главам, плагины отключены,
     RanobeLib сохраняется одним файлом (без деления на части по размеру). -->
<div class="settings-section">
    <div class="settings-section-title">Файлы RanobeLib (FB2/EPUB)</div>
    <div class="settings-row">
        <label class="settings-label" for="settingsFitFb2Images" title="Нужно для Okular: иначе крупные изображения разрезаются на несколько страниц. Снижает чёткость в других читалках">Вписывать картинки FB2 в страницу</label>
        <input id="settingsFitFb2Images" type="checkbox" class="settings-checkbox">
    </div>
</div>
